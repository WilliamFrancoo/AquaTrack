<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Aqua Track</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/firebase.js"></script></head><body class="public-page"><header class="public-header"><a class="logo" href="index.html"><i class="fa-solid fa-droplet"></i> Aqua <b>Track</b></a><nav class="public-nav"><a class="" href="index.html">Início</a><a class="" href="sobre.html">Sobre</a><a class="" href="contato.html">Contato</a><a class="btn-primar" id="navAuth" href="login.html">Entrar <i class="fa-solid fa-arrow-right"></i></a></nav></header><main class="auth-page"><form class="auth-card" id="cadastroForm"><h1><i class="fa-solid fa-user-plus" style="color:#00cfff"></i> Criar conta</h1><p>Cadastre-se para acessar o sistema.</p><div class="form-message" id="cadMsg" hidden></div><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" minlength="6" required></div><div class="field"><label>Confirmar senha</label><input id="confirmar" type="password" minlength="6" required></div><button class="form-button">Cadastrar</button><div class="auth-link">Já possui conta? <a href="login.html">Entrar</a></div></form></main><script>document.getElementById('cadastroForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('cadMsg');m.hidden=true;if(senha.value!==confirmar.value){m.hidden=false;m.textContent='As senhas não são iguais.';return}try{const c=await firebase.auth().createUserWithEmailAndPassword(email.value.trim(),senha.value);await c.user.updateProfile({displayName:nome.value.trim()});location.href='dashboard.html'}catch(err){m.hidden=false;m.textContent=err.code==='auth/email-already-in-use'?'Este e-mail já está cadastrado.':'Não foi possível criar a conta.'}});</script></body></html>
