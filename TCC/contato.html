on class="form-button" type="submit"><i class="fa-solid fa-paper-plane"></i> Enviar mensagem</button></form></div></main><script>document.getElementById('contatoForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('contatoMsg');try{await banco.ref('contatos').push({nome:nome.value.trim(),email:email.value.trim(),assunto:assunto.value.trim(),mensagem:mensagem.value.trim(),timestamp:Date.now()});m.hidden=false;m.textContent='Mensagem enviada com sucesso.';e.target.reset()}catch(err){m.hidden=false;m.textContent='Não foi possível enviar agora.'}});</script><footer style="text-align:center;padding:22px;color:#6f9bb3;font-size:11px">© 2026 Aqua Track • Monitoramento Inteligente da Água</footer><script src="js/app.js"></script></body></html>
