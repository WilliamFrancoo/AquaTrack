<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Aqua Track</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/firebase.js"></script></head><body class="public-page"><header class="public-header"><a class="logo" href="index.html"><i class="fa-solid fa-droplet"></i> Aqua <b>Track</b></a><nav class="public-nav"><a class="" href="index.html">Início</a><a class="" href="sobre.html">Sobre</a><a class="" href="contato.html">Contato</a><a class="btn-primar" id="navAuth" href="login.html">Entrar <i class="fa-solid fa-arrow-right"></i></a></nav></header><main class="auth-page"><form class="auth-card" id="loginForm"><h1><i class="fa-solid fa-right-to-bracket" style="color:#00cfff"></i> Entrar</h1><p>Acesse o monitoramento da qualidade da água.</p><div class="form-message" id="loginMsg" hidden></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" required></div><button class="form-button" type="submit">Entrar</button><div class="auth-link">Ainda não possui conta? <a href="cadastro.html">Cadastre-se</a></div></form></main><script>firebase.auth().onAuthStateChanged(u=>{if(u)location.href='dashboard.html'});document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('loginMsg');try{await firebase.auth().signInWithEmailAndPassword(email.value.trim(),senha.value);location.href='dashboard.html'}catch(err){m.hidden=false;m.textContent='E-mail ou senha incorretos.'}});</script></body></html>
